<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Akasha" data-loading="false">
  <title>Akasha</title>
  <style>
    .ak-ink { fill: #171717; }
    .ak-ghost { opacity: 0; }
    [data-loading="true"] .ak-ghost { opacity: 0.14; }
    [data-loading="true"] .ak-1 { animation: ak-up 1.9s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
    [data-loading="true"] .ak-2 { animation: ak-down 1.9s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
    [data-loading="true"] .ak-3 { animation: ak-right 1.9s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
    @keyframes ak-up {
      0%, 14% { clip-path: inset(0 0 0 0); }
      38%, 54% { clip-path: inset(0 0 100% 0); }
      54.1% { clip-path: inset(100% 0 0 0); }
      82%, 100% { clip-path: inset(0 0 0 0); }
    }
    @keyframes ak-down {
      0%, 18% { clip-path: inset(0 0 0 0); }
      42%, 58% { clip-path: inset(100% 0 0 0); }
      58.1% { clip-path: inset(0 0 100% 0); }
      86%, 100% { clip-path: inset(0 0 0 0); }
    }
    @keyframes ak-right {
      0%, 24% { clip-path: inset(0 0 0 0); }
      48%, 64% { clip-path: inset(0 0 0 100%); }
      64.1% { clip-path: inset(0 100% 0 0); }
      92%, 100% { clip-path: inset(0 0 0 0); }
    }
    @media (prefers-color-scheme: dark) {
      .ak-ink { fill: #ededed; }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-loading="true"] .ak-ghost { opacity: 0; }
      [data-loading="true"] .ak-1,
      [data-loading="true"] .ak-2,
      [data-loading="true"] .ak-3 { clip-path: none; animation: ak-fade 2.4s ease-in-out infinite; }
      @keyframes ak-fade { 0%, 100% { opacity: 1; } 50% { opacity: 0.42; } }
    }
  </style>
  <g class="ak-ghost">
    <path class="ak-ink" d="M 9 52 L 26 12 L 34.5 12 L 17.5 52 Z"/>
    <path class="ak-ink" d="M 26.5 40.7 L 34.5 21.9 L 34.5 52 L 26.5 52 Z"/>
    <path class="ak-ink" d="M 38.3 32 L 46.5 12 L 55 12 L 46.8 32 L 55 52 L 46.5 52 Z"/>
  </g>
  <path class="ak-ink ak-1" d="M 9 52 L 26 12 L 34.5 12 L 17.5 52 Z"/>
  <path class="ak-ink ak-2" d="M 26.5 40.7 L 34.5 21.9 L 34.5 52 L 26.5 52 Z"/>
  <path class="ak-ink ak-3" d="M 38.3 32 L 46.5 12 L 55 12 L 46.8 32 L 55 52 L 46.5 52 Z"/>
</svg>

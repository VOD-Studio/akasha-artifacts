<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-label="Akasha Logo">
  <title>Akasha Logo</title>
  <defs>
    <!-- Deep Obsidian Terminal Background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#111A24" />
    </linearGradient>

    <!-- Akasha Emerald-Cyan Hologram Gradient -->
    <linearGradient id="akasha-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Front Canvas Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.92" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.98" />
    </linearGradient>

    <!-- Soft Holographic Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#34D399" stroke-opacity="0.16" stroke-width="4" />

  <!-- Subtle Akasha Geometric Grid -->
  <g stroke="#34D399" stroke-opacity="0.04" stroke-width="2">
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="384" x2="512" y2="384" />
  </g>

  <!-- Back Layer: CLI Terminal Frame -->
  <g transform="translate(84, 120)">
    <rect x="0" y="0" width="224" height="224" rx="28" fill="#131E2E" stroke="#10B981" stroke-width="6" stroke-opacity="0.65" />
    <!-- Terminal Prompt ">_" -->
    <path d="M52 78 L88 110 L52 142" fill="none" stroke="#34D399" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="104" y1="142" x2="154" y2="142" stroke="#E2E8F0" stroke-width="14" stroke-linecap="round" />
  </g>

  <!-- Middle Layer: Holographic Projection Bridge -->
  <g transform="translate(144, 152)" opacity="0.68">
    <rect x="0" y="0" width="224" height="224" rx="32" fill="url(#akasha-grad)" />
  </g>

  <!-- Front Layer: Live Web Artifact Canvas -->
  <g transform="translate(204, 184)" filter="url(#glow)">
    <rect x="0" y="0" width="224" height="224" rx="32" fill="url(#card-grad)" stroke="#ECFDF5" stroke-width="4" stroke-opacity="0.8" />
    <!-- Akasha Leaf / Knowledge Node Pulse -->
    <circle cx="72" cy="74" r="18" fill="#FFFFFF" />
    <rect x="108" y="62" width="72" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.9" />
    <!-- Live Interactive Waveform -->
    <path d="M48 158 Q82 112 114 144 T176 114" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    <!-- Akasha Four-Point Star Sparkle -->
    <path d="M178 28 L184 46 L202 52 L184 58 L178 76 L172 58 L154 52 L172 46 Z" fill="#FFFFFF" />
  </g>
</svg>
